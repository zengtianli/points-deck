name: points-deck
bundle_id: cyou.tianli.pointsdeck   # 派生自 project.yml（SSOT）；fleet_audit a/g 项与 app_registry gate-mac 按它对装机
origin: own
lifecycle: active
form: ios
platforms: [iphone, ipad, mac]   # 跑在哪（正交于 form=源码住哪）；multiplatform.py audit 与 project.yml 对账

one_liner: 京宝积分随身版 —— 孩子看市值与换装、家长 Face ID 免密记一笔，账本仍是 edu.tianli.cyou 那一本

stack: swift-ui
notes: |
  **不做后端、不复刻算法。** 消费 ~/Edu/points/server.py 已有的 JSON API
  (/api/state /api/preview /api/earn /api/spend /api/undo)。分值一律服务端算,
  预览也走 /api/preview —— 两边各算各的迟早算出不同的数,而家长看到的是预览、
  孩子拿到的是记账。这条是 ~/Edu 立的铁律,本 app 继承。

  一个 app 两种身份(2026-08-28 用户拍板):
    孩子面 = 市值大字 + 「还差 N 分升级」进度条 + 走势 + 流水(登录即见)
    家长面 = 记一笔 / 撤销 / 调账(现输管理密码,Face ID 代发,**不落 cookie**)
  「管理密码不发 cookie」是 ~/Edu 的有意设计:孩子拿到已登录的设备也加不了分。
  原生这边用 Keychain + Face ID 保住它,同时省掉每次手输。

  换装美术不从零定:阈值/时代/底图的 SSOT 都在 ~/Edu/points/skins/(11 档市值 → 5 时代)。
  **禁在 Swift 里写第二份阈值表**,加一档要改两处就是漂移。
  底图由 sync-skins.sh 构建前同步进 bundle,不进本仓;整页配色从那张插画采样派生
  (上 1/3 天空 + 下 1/3 地面,压暗到能压住白字) —— 「背景要跟着木屋的背景变」。

  按付费档规格开发(2026-08-28 用户钦定):不为「同时 3 个自签」的上限做妥协设计,
  Widget 按常驻做,签名主体按可上架规划。

  **只管账本**。做题 / 错题本 / 离线课页在姊妹 app ~/Apps/ios/wrong-book
  (2026-08-28 用户拍板「分开2个app,一个关注错题,一个关注积分」)。
  两边共用 edu.tianli.cyou 的同一套账号与 cookie,但各装各的、各登各的。

  方案全文 ~/Dev/wiki/handoffs/dev/ios-fleet-landing/05-积分app方案.md
