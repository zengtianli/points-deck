name: points-deck
name_en: Growth Treasury
name_zh: 成长小金库
display_name: Growth Treasury · 成长小金库
family: edu
form: ios
platforms: [iphone, ipad, mac, watch, vision]   # 跑在哪（正交于 form=源码住哪）；multiplatform.py audit 与 project.yml 对账；须与 sop.platforms 一致
lifecycle: active
bundle_id: cyou.tianli.pointsdeck
origin: own
sop:
  # 第三段是手表 / Vision 的便宜编译车道（按 project.yml 各 target 源码清单 swiftc -typecheck，不起模拟器）
  test: bash Tests/check-parent-session.sh && python3 Tests/cli_treasury_test.py && bash Tests/check-platform-typecheck.sh
  accept:
    functionality: bash scripts/accept/run.sh functionality
    recovery: bash scripts/accept/run.sh recovery
    privacy: bash scripts/accept/run.sh privacy
    # 平台线启动冒烟：先起隔离的演示账本（scripts/demo/ledger.py，随机端口、临时数据目录、合成账号），
    # 再交给 Chapter 内置的 platform_launch（共享 sim_lane：仓外构建、无窗口模拟器 / Mac 静默启动不上屏、截图）
    launch_iphone: bash scripts/accept/launch.sh iphone
    launch_ipad: bash scripts/accept/launch.sh ipad
    launch_mac: bash scripts/accept/launch.sh mac
    launch_watch: bash scripts/accept/launch.sh watch
    launch_vision: bash scripts/accept/launch.sh vision
  ui:
  - Sources/**
  - Shared/**
  - Watch/**
  source:
  - Sources/**
  - Shared/**
  - Resources/**
  - Widget/**
  # 手表 app 随 iOS 包嵌入（PointsDeck.app/Watch/），所以它是每条线的源码，不只是手表线的
  - Watch/**
  - ShareExtension/**
  - project.yml
  - '*.entitlements'
  - cli/treasury
  test_inputs:
  - Tests/**
  - ref/**
  - test-contract.py
  - test_check_markdown_drift.py
  - scripts/tests/**
  - Package.swift
  - cli/**
  media:
  - shots
  - ../02-审核/当前版本/02-视频/成片/public-preview
  media_meta: ../02-审核/当前版本/02-视频/成片/public-preview/provenance.json
  release: perf/asc-release.json
  # 一个 App 五条平台线（用户 2026-10-02：同名、同图标、同数据；「我都有，但你用模拟器好了」）。
  # 模拟器验收、证据标 environment=simulator；Mac 线是本机原生。手表 / Vision / Mac 还没上架（distribution: none）。
  # 预算：iPhone / iPad / Mac 沿用 Chapter 默认（150 MB · 0.5%）；手表与 Vision 是我们定的目标，引擎只判 memory_mb / cpu，
  # size_mb / cold_launch_ms 由 README 与交接对照。
  platforms:
    iphone:
      simulator: {device_type: iPhone-17-Pro}
      store_shots: shots/appstore/iphone/*.png
      distribution: app_store
    ipad:
      simulator: {device_type: iPad-Pro-13-inch-M5-12GB}
      store_shots: shots/appstore/ipad/*.png
      distribution: app_store
    mac:
      store_shots: shots/appstore/mac/*.png
      distribution: none
    watch:
      scheme: PointsDeckWatch
      bundle_id: cyou.tianli.pointsdeck.watchkitapp
      source: [Watch/**]
      simulator: {device_type: Apple-Watch-Series-12-46mm}
      store_shots: shots/appstore/watch/*.png
      budget: {memory_mb: 25, cpu: 0.5, size_mb: 10, cold_launch_ms: 1500}
      distribution: none
    vision:
      simulator: {device_type: Apple-Vision-Pro-4K}
      store_shots: shots/appstore/vision/*.png
      budget: {memory_mb: 60, cpu: 0.5}
      distribution: none
  measure:  # 模拟器无界面、不抢焦点，本人用电脑时也能测（Mac 线与旧 iPhone 测量自带 10 分钟无操作门，不满足就推迟）
    # 起隔离演示账本 → 旧 iPhone 测量（perf/simulator.json，lightweight.json 引用它）→ 五条平台线
    # （perf/platforms/<线>.json）；输入没变的线跳过，任何一条推迟整体退出 75，下个空档只补没测完的。
    command: ~/Dev/.venv/bin/python scripts/perf/measure_platforms.py
    outputs: [perf/simulator.json, perf/lightweight.json, perf/raw, perf/platforms]
    in_use: true
  runtime_note: 平台线模式（2026-10-02）：五条线都按模拟器验收（Mac 线本机原生），实体 iPhone 不回读、真机未验证；ASC 回读只核对已上传的 iOS 构建。
  # 给 Agent 的命令行：同一服务端 /api/* 的薄客户端（stdlib）。本机 Mac 构建会把它拷进
  # Contents/Resources/bin/treasury（project.yml 构建阶段，iOS 包与归档不带）；本机现在没装 Mac 版，
  # 所以 ~/.local/bin/treasury 由 cli/install.sh 链到本仓入口、这里写 host: repo。第一次装上 Mac 版后
  # 重跑 cli/install.sh（改链到 .app 内），并去掉下面的 host 与 entry（改为 App 托管）。
  cli:
    commands:
    - treasury
    host: repo
    entry: cli/treasury
  runtime:
    kind: ios
    readback: builtin:asc-device
  product:
    distribution: public
    source_visibility: public
    source_url: https://github.com/zengtianli/points-deck
    rationale: 记录努力、积攒积分，让成长有自己的模样。 面向外部使用者提供现有公开产品与源码入口，持续维护获取、教程和版本证据。
