name: points-deck
name_en: Growth Treasury
name_zh: 成长小金库
display_name: Growth Treasury · 成长小金库
family: edu
form: ios
platforms: [iphone, ipad, mac, watch, vision]   # 跑在哪（正交于 form=源码住哪）；multiplatform.py audit 与 project.yml 对账；须与 sop.platforms 一致
lifecycle: active
bundle_id: cyou.tianli.pointsdeck
origin: own
sop:
  store:
    platform: ios
    product_id: points-deck-ios
    source_project: project.yml
    version_id: 604a9480-62ed-4102-80b5-b5f3666a6210
    build: '13'
    questionnaire: store/4.3-4.2.6-九问.md
    changes_file: store/changes.json
    notes_points:
      '1': "Parents record children's daily efforts, review balances and trends, and redeem rewards agreed within the family."
      '3': "The product-specific contribution is the native family ledger, parent recording and configuration flow, reward redemption and illustrated growth presentation backed by our own ledger service."
      '5': "This is one product across Apple device clients."
      '6': "Related learning apps address different tasks, such as collecting and reviewing mistakes; they do not provide this family reward workflow."
      '7': "Shared modules handle configuration, update checks and platform lifecycle."
      '8': "The iOS runtime uses Apple frameworks and declares no third-party advertising or tracking SDK."
  product_basics:
    schema_version: 1
    features:
      settings: {entry: '登录页顶部设置；账户→设置；显示偏好与配置导入导出', readback: '~/Dev/.venv/bin/python scripts/accept/product_basics.py --app <候选.app> --receipt <sim_lane回执.json>；原生新进程 --basics-readback'}
      shortcuts: {entry: '设置→启用刷新快捷键；本应用内⌘R，iOS需外接键盘', readback: '原生 --ui-self-test 检查真实刷新与开关；--basics-readback 读回'}
      icloud: {entry: '设置→同步、备份与更新→使用iCloud记住配置；仅显示操作偏好，默认关闭', readback: '原生 --basics-readback 输出 sync_enabled/sync_status；固定验收跑隔离同步'}
      updates: {entry: '设置→同步、备份与更新→检查更新／App Store获取，应用ID6806799638', readback: '原生 --ui-self-test 的 App Store检查、错误恢复与获取入口原件'}
    inputs:
    - scripts/accept/product_basics.py
    - scripts/demo/ledger.py
    - Sources/TreasurySettings.swift
    - Sources/MobileProductLifecycle.swift
    - Sources/ProductBasicsSelfTest.swift
    - App.entitlements
    - scripts/accept/platform_ui.py
  account:
    mode: password
    rationale: 公开家长账号优先手机号验证码，保留邮箱与密码；注册、换绑和找回按 ../PRD.md 实施，短信通道待真实投递验收
    verification_channels: [phone, email]
    phone_login: true
    inputs:
    - ../../../web/points/server.py
    - ../../../web/points/account_security.py
    - ../../../web/points/account_phone.py
    - ../../../web/points/requirements-subscriptions.txt
    - ../../../web/points/vps_setup.py
    - ../../../../../Dev/tools/dev/lib/tools/cloud/aliyun_sms.py
  # 第三段是手表 / Vision 的便宜编译车道（按 project.yml 各 target 源码清单 swiftc -typecheck，不起模拟器）
  test: bash Tests/check-parent-session.sh && python3 Tests/cli_treasury_test.py && ~/Dev/.venv/bin/python -m pytest -n auto Tests/cli_parser_test.py Tests/account_acceptor_test.py Tests/platform_ui_admission_test.py ../../../web/points/test_phone_account.py -q && bash Tests/check-platform-typecheck.sh
  accept:
    store: builtin:store
    product_basics: ~/Dev/.venv/bin/python scripts/accept/product_basics.py --prepare-candidate
    account_lifecycle: python3 scripts/accept/account_lifecycle.py --run-full
    functionality: bash scripts/accept/run.sh functionality
    recovery: bash scripts/accept/run.sh recovery
    privacy: bash scripts/accept/run.sh privacy
    # 平台线启动冒烟：先起隔离的演示账本（scripts/demo/ledger.py，随机端口、临时数据目录、合成账号），
    # 再交给 Chapter 内置的 platform_launch（共享 sim_lane：仓外构建、无窗口模拟器 / Mac 静默启动不上屏、截图）
    launch_iphone: bash scripts/accept/launch.sh iphone
    launch_ipad: bash scripts/accept/launch.sh ipad
    launch_mac: bash scripts/accept/launch.sh mac
    launch_watch: bash scripts/accept/launch.sh watch
    launch_vision: bash scripts/accept/launch.sh vision
  ui:
  - Sources/**
  - Shared/**
  - Watch/**
  source:
  - Sources/**
  - Shared/**
  - Resources/**
  - Widget/**
  # 手表 app 随 iOS 包嵌入（PointsDeck.app/Watch/），所以它是每条线的源码，不只是手表线的
  - Watch/**
  - ShareExtension/**
  - project.yml
  - '*.entitlements'
  - cli/treasury
  test_inputs:
  - Tests/**
  - ref/**
  - test-contract.py
  - test_check_markdown_drift.py
  - scripts/tests/**
  - Package.swift
  - cli/**
  media:
  - shots
  - ../02-审核/当前版本/02-视频/成片/public-preview
  - perf/media/current
  media_meta: ../02-审核/当前版本/02-视频/成片/public-preview/provenance.json
  release: perf/asc-release.json
  # 一个 App 五条平台线（用户 2026-10-02：同名、同图标、同数据；「我都有，但你用模拟器好了」）。
  # 模拟器验收、证据标 environment=simulator；Mac 线是本机原生。手表 / Vision / Mac 还没上架（distribution: none）。
  # 预算：iPhone / iPad / Mac 沿用 Chapter 默认（150 MB · 0.5%）；手表与 Vision 是我们定的目标，引擎只判 memory_mb / cpu，
  # size_mb / cold_launch_ms 由 README 与交接对照。
  platforms:
    iphone:
      input_normalization: {proof: perf/input-normalizations/finder-iphone.json, sha256: 16c9dc0f1f29beca648a7762c171e7de5e384b29ce518f74809df534bb3695ae}
      simulator: {device_type: iPhone-17-Pro}
      store_shots: shots/appstore/iphone/*.png
      capture:
        command: ~/Dev/.venv/bin/python scripts/media/capture_current.py
        inputs: [Sources/**, Shared/**, Tests/PlatformUITests.swift, scripts/accept/platform_ui.py, scripts/demo/ledger.py, scripts/media/capture_current.py]
        outputs: [shots/current-iphone, perf/media/current]
        in_use: true
      distribution: app_store
    ipad:
      input_normalization: {proof: perf/input-normalizations/finder-ipad.json, sha256: 417206fd5c0ab717084d80ea9d0f46f120bf4483a2bd482845012e5165ece8b5}
      simulator: {device_type: iPad-Pro-13-inch-M5-12GB}
      store_shots: shots/appstore/ipad/*.png
      distribution: app_store
    mac:
      input_normalization: {proof: perf/input-normalizations/finder-mac.json, sha256: 525cf2503ecda44bede96eb5105c8cb4a43bd2180995c79dca892887c2d92401}
      store_shots: shots/appstore/mac/*.png
      distribution: none
    watch:
      input_normalization: {proof: perf/input-normalizations/finder-watch.json, sha256: 9c1756cf7eef1b98d523e42180582fb66e094fe1b79ccea1e830c092ab5c1249}
      scheme: PointsDeckWatch
      bundle_id: cyou.tianli.pointsdeck.watchkitapp
      source: [Watch/**]
      simulator: {device_type: Apple-Watch-Series-12-46mm}
      store_shots: shots/appstore/watch/*.png
      budget: {memory_mb: 25, cpu: 0.5, size_mb: 10, cold_launch_ms: 1500}
      distribution: none
    vision:
      input_normalization: {proof: perf/input-normalizations/finder-vision.json, sha256: ef0f725b3e4d95c48b2dbad21d7e88bfdf96d0beffb2057c8652d3fa11a3212e}
      simulator: {device_type: Apple-Vision-Pro-4K}
      store_shots: shots/appstore/vision/*.png
      budget: {memory_mb: 60, cpu: 0.5}
      distribution: none
  measure:  # 模拟器无界面、不抢焦点，本人用电脑时也能测（Mac 线与旧 iPhone 测量自带 10 分钟无操作门，不满足就推迟）
    # 起隔离演示账本 → 旧 iPhone 测量（perf/simulator.json，lightweight.json 引用它）→ 五条平台线
    # （perf/platforms/<线>.json）；输入没变的线跳过，任何一条推迟整体退出 75，下个空档只补没测完的。
    command: ~/Dev/.venv/bin/python scripts/perf/measure_platforms.py
    platform_env: SOP_PERF_PLATFORM
    outputs: [perf/simulator.json, perf/lightweight.json, perf/raw, perf/platforms]
    in_use: true
  runtime_note: 平台线模式（2026-10-02）：五条线都按模拟器验收（Mac 线本机原生），实体 iPhone 不回读、真机未验证；ASC 回读只核对已上传的 iOS 构建。
  # 给 Agent 的命令行：同一服务端 /api/* 的薄客户端（stdlib）。本机 Mac 构建会把它拷进
  # Contents/Resources/bin/treasury（project.yml 构建阶段，iOS 包与归档不带）；本机现在没装 Mac 版，
  # 所以 ~/.local/bin/treasury 由 cli/install.sh 链到本仓入口、这里写 host: repo。第一次装上 Mac 版后
  # 重跑 cli/install.sh（改链到 .app 内），并去掉下面的 host 与 entry（改为 App 托管）。
  cli:
    commands:
    - treasury
    host: repo
    entry: cli/treasury
  # 界面功能对照（每项功能都能不点界面完成，2026-10-07）：从 Sources/ 与 Watch/ 的界面源码逐项列。
  # 手机端没法装命令行，用本机 treasury（同一服务端 /api/* 的薄客户端）对应；读回 treasury version 不登录、只读。
  # 设备偏好与原生配置由 product_basics 的隔离 App 验收及新进程读回；
  # 后端 treasury 不读取本机会话或设备偏好。
  agent_cli:
    readback: treasury version
    features:
    - name: 手机验证码登录
      command: treasury account phone-login
    - name: 账号密码登录
      command: treasury me
    - name: 手机号注册
      command: treasury account phone-register
    - name: 邮箱注册
      command: treasury account register
    - name: 忘记密码（手机号或邮箱）
      command: treasury account recover
    - name: 阅读用户协议与隐私政策
      human: 只在窗口里有意义：打开随包的政策正文，同帮助页
    - name: 账本：市值、当前档位与还差多少升档
      command: treasury state
    - name: 账本：流水列表与流水详情（含下拉刷新）
      command: treasury entries
    - name: 流水筛选（全部、加分、减分、兑换）
      command: treasury entries
    - name: 查看更早流水
      command: treasury entries
    - name: 撤销这笔误记
      command: treasury undo
    - name: 记账后的撤销提示条
      command: treasury undo
    - name: 流水实时刷新
      human: 只在窗口里有意义：App 开着时的 SSE 长连接；命令每次直读服务端
    - name: 离线时显示缓存与离线提示
      device: 上次账本的缓存存在那台设备的钥匙串里，离线标记只在 App 运行时的内存里，设备不上报；命令与后端读不到设备里那份，命令自己连不上即退出 1
    - name: 走势：近 7 天、近 30 天、全部
      command: treasury trend
    - name: 加分与减分项目清单
      command: treasury rules
    - name: 固定项目一键记分
      command: treasury earn
    - name: 参数项目预览分值
      command: treasury preview
    - name: 参数项目记入账本
      command: treasury earn
    - name: 临时记一笔
      command: treasury adjust
    - name: 超时后核对原操作结果
      command: treasury request-result
    - name: 兑换清单（价格、解锁与够不够换）
      command: treasury shop
    - name: 确认兑换
      command: treasury spend
    - name: 记分项目管理（新建、编辑、排序、归档）
      command: treasury config
    - name: 兑换奖励管理（新建、编辑、排序、归档）
      command: treasury config
    - name: 配置冲突时读取最新并合并
      command: treasury config
    - name: 更多设置（高级规则、商品与档位）
      command: treasury config
    - name: 账号概况（昵称、头像、邮箱与手机状态）
      command: treasury me
    - name: 修改昵称与头像
      command: treasury profile
    - name: 等级与待遇
      command: treasury tiers
    - name: 导出账本
      command: treasury export
    - name: 账号安全：绑定或更换手机号
      command: treasury account phone-bind
    - name: 账号安全：修改登录密码
      command: treasury account passwd
    - name: 账号安全：设置登录密码（未设过）
      command: treasury account password-set
    - name: 账号安全：绑定、验证或更换邮箱
      command: treasury account email-bind
    - name: 账号安全：近期账号安全记录
      command: treasury me
    - name: 退出登录
      device: 登录态就是这台设备上那枚会话 Cookie 加本机缓存。退出时服务端只回一个清 Cookie 的响应，不留会话记录，App 再清本机账本缓存与小组件快照并让手表下线；命令自己不保存登录态，命令与后端够不到设备里那份
    - name: 注销账号
      command: treasury account delete
    - name: 申请注销（即时注销被拒时）
      command: treasury account delete-request
    - name: 查询注销处理状态
      command: treasury account delete-status
    - name: 反馈、收不到验证码与恢复申诉的邮件链接
      human: 只在窗口里有意义：打开邮件撰写
    # 「配置与更新」面板：手机、平板、Vision 上的那份只在设备本机，记 device。
    # 范围：Mac 版是本组件登记的平台线，但本机现在没装（见上面 cli 的说明），没有装着的 Mac 版就没有可核对的状态，按约定不加 Mac 行；
    # 装上 Mac 版后，同一面板的状态在那台 Mac 上，届时另列两行并让 treasury 加 update check / update install（转调 Mac 版 App 里的共用更新命令）。
    - name: 检查更新
      device: 手机、平板、Vision 上拿本机已装版本去比 App Store 上的版本，结论只显示在那台设备上，不留存也不上报；命令与后端读不到。范围是手机、平板、Vision；Mac 版本机没装，不在本行内
    - name: 升级到新版
      device: 手机、平板、Vision 上是「前往 App Store」，由系统在那台设备上安装；命令与后端替它装不了。范围是手机、平板、Vision；Mac 版本机没装，不在本行内
    - name: 升档庆祝动画
      human: 只在窗口里有意义：升档后在屏幕上播放的动画；档位本身读 treasury state
    - name: 桌面小组件
      human: 要真人在主屏上摆放；显示的数字同 treasury state
    - name: Apple Watch 只读摘要与最近流水
      command: treasury state
    - name: Apple Watch 表盘复杂功能
      human: 要真人在表盘上摆放；显示的数字同 treasury state
    - name: 配色预览与小组件预览
      human: 只在窗口里有意义：验证用启动参数打开的预览页
  runtime:
    kind: ios
    readback: builtin:asc-device
  product:
    distribution: public
    source_visibility: public
    source_url: https://github.com/zengtianli/points-deck
    rationale: 记录努力、积攒积分，让成长有自己的模样。 面向外部使用者提供现有公开产品与源码入口，持续维护获取、教程和版本证据。
