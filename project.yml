name: PointsDeck
options:
  bundleIdPrefix: cyou.tianli
  deploymentTarget: { iOS: "18.0" }
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  PointsDeck:
    type: application
    platform: iOS
    # 每次构建前从 ~/Edu 同步一次时代底图。
    # 为什么不把图提交进仓:图的 SSOT 在 ~/Edu/points/skins/(那边有生图 prompt、seed、
    # 皮肤清单门)，仓里存一份副本就是第二份，改了图两边会漂。
    # 为什么必须挂在构建前:漏同步的表现是**编译通过、装上能跑、只是没有背景** ——
    # 那种缺陷不会报错，只会被当成「设计就这样」。缺源时脚本 exit 1，构建直接失败。
    preBuildScripts:
      - script: bash "$PROJECT_DIR/sync-skins.sh"
        name: 同步时代底图
        basedOnDependencyAnalysis: false
      # 同理:练习页的 SSOT 在 ~/Edu。漏同步的表现是「那一课点不开」或
      # 「做的是上一版的题」——都不报错。组装器与上线共用同一道 PII 门。
      - script: bash "$PROJECT_DIR/sync-lessons.sh"
        name: 同步练习页
        basedOnDependencyAnalysis: false
    sources:
      - path: Sources
      # ⚠ 图标资产必须在这儿列出来。漏了的表现是**编译通过、装机通过、桌面白板**——
      #   ASSETCATALOG_COMPILER_APPICON_NAME 指向一个不在工程里的 catalog，
      #   actool 根本没被调起，全程零报错。2026-08-28 实测踩到。
      - path: Resources/Assets.xcassets
      # 时代底图 —— folder 引用(不是 group)，进包后保持 Skins/ 子目录结构
      - path: Resources/Skins
        type: folder
        buildPhase: resources
      # 练习页 —— folder 引用,进包后保持 primary-*/ 子目录结构(页面里是相对链接)
      - path: Resources/Lessons
        type: folder
        buildPhase: resources
    dependencies:
      - target: PointsWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cyou.tianli.pointsdeck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: 京宝积分
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: App.entitlements
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets: []
      configVariants: []
  PointsWidget:
    type: app-extension
    platform: iOS
    # ⚠ xcodegen 的 info.path 是**生成目标**，不是「用这个现成文件」——
    # 手写一份 Widget/Info.plist 放那儿会被直接覆盖掉，内容必须写在 properties 里。
    # 少了 NSExtension 的表现是:编译通过、装机报 "Invalid placeholder attributes"。
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 京宝积分
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - path: Widget
        excludes: ["Info.plist"]
      # 两边共用的同一份文件，不复制 —— Era/RollingNumber 是视觉，Snapshot 是数据契约
      - path: Sources/Skin.swift
      - path: Sources/Snapshot.swift
      - path: Sources/WidgetViews.swift
      # widget 也从插画派生配色，同一份资源
      - path: Resources/Skins
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cyou.tianli.pointsdeck.widget
        CODE_SIGN_ENTITLEMENTS: Widget.entitlements
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
