name: PointsDeck
options:
  bundleIdPrefix: cyou.tianli
  deploymentTarget: { iOS: "18.0", macOS: "15.0" }
  createIntermediateGroups: true
settings:
  base:
    APP_DISPLAY_NAME: 成长小金库
    CODE_SIGN_STYLE: Automatic
    # 2026-08-29 起已开通付费 Developer Program(团队 B9LJH93LA4),不再留空走免费 Personal Team。
    DEVELOPMENT_TEAM: B9LJH93LA4
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SWIFT_VERSION: "5.0"
targets:
  PointsDeck:
    type: application
    supportedDestinations: [iOS, macOS]
    # 每次构建前从 ~/Edu 同步一次时代底图。
    # 为什么不把图提交进仓:图的 SSOT 在 ~/Edu/points/skins/(那边有生图 prompt、seed、
    # 皮肤清单门)，仓里存一份副本就是第二份，改了图两边会漂。
    # 为什么必须挂在构建前:漏同步的表现是**编译通过、装上能跑、只是没有背景** ——
    # 那种缺陷不会报错，只会被当成「设计就这样」。缺源时脚本 exit 1，构建直接失败。
    preBuildScripts:
      - script: bash "$PROJECT_DIR/sync-skins.sh"
        name: 同步时代底图
        basedOnDependencyAnalysis: false
    sources:
      # 总部共享：macOS 侧给 iOS-only SwiftUI 修饰符提供同名 no-op，调用点不改（multiplatform.py 注入）
      - path: Shared/PlatformCompat.swift
      - path: Sources
      # ⚠ 图标资产必须在这儿列出来。漏了的表现是**编译通过、装机通过、桌面白板**——
      #   ASSETCATALOG_COMPILER_APPICON_NAME 指向一个不在工程里的 catalog，
      #   actool 根本没被调起，全程零报错。2026-08-28 实测踩到。
      - path: Resources/Assets.xcassets
      # 时代底图 —— folder 引用(不是 group)，进包后保持 Skins/ 子目录结构
      - path: Resources/Skins
        type: folder
        buildPhase: resources
    dependencies:
      - target: PointsWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cyou.tianli.pointsdeck
        # ── Mac 侧（multiplatform.py 注入）：沙盒 + 加固运行时是 TestFlight for Mac 的硬门槛；
        #    entitlements 按 sdk 分开给，iOS 的 profile 不认 app-sandbox 这个键。
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Mac.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        # 四方向全给:上 TestFlight 时 App Store Connect 对 universal(iPhone+iPad)app 强制
        # 要求 iPad 分屏四方向不能缺,只给 Portrait 会在上传阶段被拒(2026-08-29 wrong-book 实证)。
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # 出口合规:声明不使用非豁免加密 → TestFlight 每次传新包不再弹问卷,
        # 直接进 Ready to Test(缺这行则每个 build 都要人去网页点一次)。
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: App.entitlements
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets: []
      configVariants: []
  PointsWidget:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    # ⚠ xcodegen 的 info.path 是**生成目标**，不是「用这个现成文件」——
    # 手写一份 Widget/Info.plist 放那儿会被直接覆盖掉，内容必须写在 properties 里。
    # 少了 NSExtension 的表现是:编译通过、装机报 "Invalid placeholder attributes"。
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      # 总部共享：macOS 侧给 iOS-only SwiftUI 修饰符提供同名 no-op，调用点不改（multiplatform.py 注入）
      - path: Shared/PlatformCompat.swift
      - path: Widget
        excludes: ["Info.plist"]
      # 两边共用的同一份文件，不复制 —— Era/RollingNumber 是视觉，Snapshot 是数据契约
      - path: Sources/Skin.swift
      - path: Sources/AppIdentity.swift
      - path: Sources/Snapshot.swift
      - path: Sources/WidgetViews.swift
      # widget 也从插画派生配色，同一份资源
      - path: Resources/Skins
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cyou.tianli.pointsdeck.widget
        # ── Mac 侧（multiplatform.py 注入）：沙盒 + 加固运行时是 TestFlight for Mac 的硬门槛；
        #    entitlements 按 sdk 分开给，iOS 的 profile 不认 app-sandbox 这个键。
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Mac.PointsWidget.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        CODE_SIGN_ENTITLEMENTS: Widget.entitlements
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
